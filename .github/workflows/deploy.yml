name: CI (typecheck / lint / build)

# Production deploys are handled by Vercel's native Git integration
# (push -> Vercel auto-build). This workflow only validates that every
# commit on master is buildable. The previous vercel-CLI deploy steps were
# removed: they failed on every run since 2026-08 (expired VERCEL_TOKEN)
# while the site kept deploying via the Git integration.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build
